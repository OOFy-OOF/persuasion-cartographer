services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      - AI_ROUTER_API_KEY=${AI_ROUTER_API_KEY}
      - AI_ROUTER_BASE_URL=${AI_ROUTER_BASE_URL}
      - AI_ROUTER_MODEL=${AI_ROUTER_MODEL:-gpt-5.6-luna}

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./web:/srv/web:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data:
