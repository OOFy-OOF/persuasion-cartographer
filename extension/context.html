<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Rhetoric - Persuasion Cartographer</title>
    <link rel="stylesheet" href="context.css">
</head>
<body>
    <header>
        <p class="eyebrow">A rhetorical microscope</p>
        <h1>Persuasion Cartographer</h1>
        <p>Review the selected passage, then map its rhetorical techniques.</p>
    </header>
    <main>
        <section class="panel">
            <label for="text-input">Selected text</label>
            <textarea id="text-input" maxlength="20000"></textarea>
            <div class="actions">
                <p id="status" role="status" aria-live="polite">Loading selected text...</p>
                <button id="analyze-button" type="button">Analyze rhetoric</button>
            </div>
        </section>
        <section id="results" class="panel hidden" aria-labelledby="results-title">
            <div class="results-heading">
                <h2 id="results-title">Analysis</h2>
                <span id="confidence" class="confidence"></span>
            </div>
            <p id="abstain" class="abstain hidden"></p>
            <div id="spans"></div>
            <section id="framing-section" class="framing hidden">
                <h3>Framing notes</h3>
                <ul id="framing"></ul>
            </section>
            <p class="disclaimer">This map does not assess truth, intent, or morality.</p>
        </section>
    </main>
    <script src="context.js"></script>
</body>
</html>
