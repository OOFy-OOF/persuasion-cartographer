<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persuasion Cartographer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <div class="header-main">
            <div>
                <p class="eyebrow">A rhetorical microscope</p>
                <h1>Persuasion Cartographer</h1>
            </div>
            <button id="settings-button" class="settings-button" type="button" aria-label="Configure API endpoint" title="Configure API endpoint">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Zm9 4.5v-1.8l-2.1-.5a7.2 7.2 0 0 0-.7-1.7l1.1-1.8-1.3-1.3-1.8 1.1a7.2 7.2 0 0 0-1.7-.7L14 4h-1.8l-.5 2.1a7.2 7.2 0 0 0-1.7.7L8.2 5.7 6.9 7l1.1 1.8a7.2 7.2 0 0 0-.7 1.7L5.2 11v1.8l2.1.5a7.2 7.2 0 0 0 .7 1.7l-1.1 1.8 1.3 1.3 1.8-1.1a7.2 7.2 0 0 0 1.7.7l.5 2.1H14l.5-2.1a7.2 7.2 0 0 0 1.7-.7l1.8 1.1 1.3-1.3-1.1-1.8a7.2 7.2 0 0 0 .7-1.7l2.1-.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <p class="intro">Explore how a passage persuades, without judging whether it is true.</p>
    </header>

    <main>
        <label for="text-input">Text to map</label>
        <textarea id="text-input" maxlength="20000" placeholder="Select text on a page, or paste it here..."></textarea>
        <p class="hint">Selecting text on a page fills this box when you open the extension.</p>
        <button id="analyze-button" type="button">Analyse text</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section id="results" class="results hidden" aria-labelledby="results-title">
            <div class="results-heading">
                <h2 id="results-title">Analysis</h2>
                <span id="confidence" class="confidence"></span>
            </div>
            <p id="abstain" class="abstain hidden"></p>
            <div id="spans"></div>
            <section id="framing-section" class="framing hidden">
                <h3>Framing notes</h3>
                <ul id="framing"></ul>
            </section>
            <p class="disclaimer">This map does not assess truth, intent, or morality.</p>
        </section>
    </main>
    <script src="popup.js"></script>
</body>
</html>
